name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ai-agent-contet
  REGION: asia-southeast1
  REPOSITORY: ai-content-agent
  SERVICE: ai-content-agent
  IMAGE: asia-southeast1-docker.pkg.dev/ai-agent-contet/ai-content-agent/bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/369389875705/locations/global/workloadIdentityPools/github/providers/ai-content-agent
          service_account: github-deployer@ai-agent-contet.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --tag "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy revision
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --min-instances 0 \
            --max-instances 3 \
            --no-cpu-throttling \
            --quiet
